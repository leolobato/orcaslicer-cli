name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - 'feat/**'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: orcaslicer-headless:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Prepare data dir
        run: mkdir -p data

      - name: Start container
        run: |
          docker run -d --name orcaslicer-headless \
            -p 8070:8070 \
            -v ${{ github.workspace }}/data:/data \
            -v ${{ github.workspace }}/app:/app/app \
            -v ${{ github.workspace }}/tests:/app/tests \
            -v ${{ github.workspace }}/conftest.py:/app/conftest.py \
            -v ${{ github.workspace }}/pytest.ini:/app/pytest.ini \
            -v ${{ github.workspace }}/scripts:/app/scripts:ro \
            -v ${{ github.workspace }}/cpp/src/generated:/app/cpp/src/generated:ro \
            -v ${{ github.workspace }}/vendor:/app/vendor:ro \
            orcaslicer-headless:ci
          # Wait for /health
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8070/health; then echo; break; fi
            sleep 2
          done

      - name: Run unit tests
        run: |
          docker exec orcaslicer-headless pytest tests/ -q \
            --ignore=tests/integration

      - name: Check Tab.cpp layout extraction is fresh
        run: docker exec orcaslicer-headless python scripts/extract_tab_layout.py --check

      - name: Check process allowlist drift
        run: docker exec orcaslicer-headless python scripts/check_allowlist.py

      - name: Smoke health + profiles
        run: |
          curl -sf http://localhost:8070/health
          curl -sf 'http://localhost:8070/profiles/machines' | python3 -c \
            "import json,sys; d=json.load(sys.stdin); print('machines:', len(d.get('machines', [])))"
          curl -sf 'http://localhost:8070/profiles/filaments?ams_assignable=true' | python3 -c \
            "import json,sys; d=json.load(sys.stdin); print('ams filaments:', len(d.get('filaments', [])))"

      - name: Container logs on failure
        if: failure()
        run: docker logs orcaslicer-headless
